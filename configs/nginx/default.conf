server {
    listen 80;
    server_name api.readmeow.tech;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.readmeow.tech;

    # Пути к сертификатам внутри контейнера.
    # Они должны соответствовать тому, куда Certbot сохраняет их на хосте
    # и куда вы их монтируете в docker-compose.yml.
    ssl_certificate /etc/letsencrypt/live/api.readmeow.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.readmeow.tech/privkey.pem;

    # Рекомендуемые настройки SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s; # Используйте доверенные DNS-серверы
    resolver_timeout 5s;

    location / {
        proxy_pass http://readmeow:3333;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Важно: указываем, что запрос пришел по HTTPS
    }
}