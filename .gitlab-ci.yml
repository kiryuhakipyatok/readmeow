stages:          
  - build
  - test
  - migrations
  - cert
  - deploy

before_script:
  - echo "generating .env file..."
  - echo "CONFIG_PATH=$CONFIG_PATH" > .env
  - echo "APP_ENV=$APP_ENV" >> .env
  - echo "POSTGRES_PORT=$POSTGRES_PORT" >> .env
  - echo "POSTGRES_TIMEZONE=$POSTGRES_TIMEZONE" >> .env
  - echo "REDIS_PORT=$REDIS_PORT" >> .env
  - echo "SECRET=$SECRET" >> .env
  - echo "ELASTICSEARCH_PORT=$ELASTICSEARCH_PORT" >> .env
  - echo "METRIC_SERVER_PORT=$METRIC_SERVER_PORT" >> .env
  - echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env
  - echo "SSL_MODE=$SSL_MODE" >> .env
  - echo "REDIS_PASSWORD=$REDIS_PASSWORD" >> .env
  - echo "ELASTICSEARCH_PASSWORD=$ELASTICSEARCH_PASSWORD" >> .env
  - echo "ELASTICSEARCH_USER=$ELASTICSEARCH_USER" >> .env
  - echo "POSTGRES_USER=$POSTGRES_USER" >> .env
  - echo "POSTGRES_DB=$POSTGRES_DB" >> .env
  - echo "CLOUDINARY_URL=$CLOUDINARY_URL" >> .env
  - echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> .env
  - echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> .env
  - echo "GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID" >> .env
  - echo "GITHUB_CLIENT_SECRET=$GITHUB_CLIENT_SECRET" >> .env
  - echo "GF_SECURITY_ADMIN_PASSWORD=$GF_SECURITY_ADMIN_PASSWORD" >> .env
  - echo "GRAFANA_PORT=$GRAFANA_PORT" >> .env
  - echo "PROMETHEUS_PORT=$PROMETHEUS_PORT " >> .env
  - echo "KIBANA_PORT=$KIBANA_PORT" >> .env
  - echo "SERVER_PORT=$SERVER_PORT" >> .env
  - echo "EMAIL_ADDRESS=$EMAIL_ADDRESS" >> .env
  - echo "EMAIL_PASSWORD=$EMAIL_PASSWORD" >> .env
  - echo "GOOSE_DRIVER=$GOOSE_DRIVER" >> .env
  - echo "GOOSE_DBSTRING=$GOOSE_DBSTRING" >> .env
  - echo "GOOSE_MIGRATIONS_DIR=$GOOSE_MIGRATIONS_DIR" >> .env
  - echo "MIGRATIONS_PATH=$MIGRATIONS_PATH" >> .env
  - echo ".env file generated"

build-job:      
  stage: build
  script:
    - docker build -t readmeow-image .
    - docker build -f nginx.Dockerfile -t custom-nginx-image .

test-job:
  stage: test
  script:
    - echo "ooops... there are no tests"

migrations-job:  
  stage: migrations   
  script:
    - docker-compose up -d postgres
    - docker-compose run --rm migrate up

cert-job:
  stage: cert
  script:
  - mkdir -p ./data/certbot/conf
  - mkdir -p ./data/certbot/credentials
    # 2. Проверяем, что директории созданы и какие у них права
  - echo "--- Проверка директорий на хосте ---"
  - ls -ld ./data/certbot
  - ls -ld ./data/certbot/conf
  - ls -ld ./data/certbot/credentials
  - echo "-----------------------------------"

  # 3. Создаем файл credentials
  - echo "dns_digitalocean_token = $DIGITALOCEAN_API_TOKEN" > ./data/certbot/credentials/digitalocean.ini

  # 4. Устанавливаем права на файл credentials
  - chmod 600 ./data/certbot/credentials/digitalocean.ini 

  # 5. Проверяем, что файл создан и какие у него права на хосте
  - echo "--- Проверка файла credentials на хосте ---"
  - ls -l ./data/certbot/credentials/digitalocean.ini
  - cat ./data/certbot/credentials/digitalocean.ini # ВНИМАНИЕ: Это выведет токен в логи CI. Удалите после отладки!
  - echo "-----------------------------------------"
  - echo "--- Проверка монтирования внутри контейнера Certbot ---"
  - docker-compose run --rm certbot bash -c "ls -la /etc/letsencrypt && ls -la /credentials && cat /credentials/digitalocean.ini"
  - echo "-----------------------------------------------------"
  - docker-compose run --rm certbot
  cache:
    paths:
      - ./data/certbot/conf
      - ./data/certbot/credentials
    policy: push

deploy-job:
  stage: deploy
  script:
    
    # - docker-compose run --rm certbot
    # - docker-compose restart nginx
    - docker-compose up -d readmeow
    - sleep 5s
    - EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' readmeow-readmeow-1)
    - if [ "$EXIT_CODE" -ne 0 ]; then
        echo "Container failed with exit code $EXIT_CODE";
        docker logs readmeow-readmeow-1;
        exit 1;
      fi
    - docker-compose logs readmeow
    - docker-compose up -d nginx
  cache:
    paths:
      - .data/certbot/conf
      - .data/certbot/credentials
    policy: pull
